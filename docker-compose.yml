services:
  postgres:
    image: postgres:16-alpine
    container_name: mise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mise
      POSTGRES_PASSWORD: mise_dev_password
      POSTGRES_DB: mise_db
    ports:
      - "5432:5432"
    volumes:
      - mise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mise -d mise_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mise_postgres_data:
